name: ci
# Upgrade safety net (see TESTING.md). Every PR (incl. Dependabot), main, and agent/** branches
# (an agent gets CI without opening a PR). Nothing is pushed.
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: server tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    # 3.12 = the image today, 3.14 = next. Both are gates since the /session fix (TESTING.md).
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install --no-cache-dir -r server/app/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: server

  smoke:
    name: container smoke
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          load: true
          push: false
          tags: lbgca:smoke
      - name: hardened (read-only rootfs, named volumes)
        run: bash scripts/smoke.sh lbgca:smoke ro
      - name: legacy box compose (root, bind mounts, port 80; data kept across restart/re-create)
        run: bash scripts/smoke.sh lbgca:smoke legacy
      - name: hosh-deploy compose (user 10001, read-only, lbgca-data at /data, PORT 8000, POST_DEPLOY)
        run: bash scripts/smoke.sh lbgca:smoke template
      - name: cutover rehearsal (legacy data -> lbgca-data, same sha256; rollback to legacy)
        run: bash scripts/smoke.sh lbgca:smoke cutover
      - name: box register check (hosh-deploy register simulation)
        run: bash scripts/check-register.sh

  ihm:
    name: ihm build
    runs-on: ubuntu-latest
    container: node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5 # Node 26 LTS (CVE-2026-111497; 20 is EOL)
    # Compile check: images are not in git, placeholders stand in for them (scripts/ihm-stub-assets.sh).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: ihm
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund
          sh ../scripts/ihm-stub-assets.sh
          CI=false npm run build
          grep -q '<div id="root">' build/index.html
          ls build/static/js/main.*.js
