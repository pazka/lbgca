version: 2
updates:
  - package-ecosystem: docker
    directory: "/server"
    schedule: { interval: monthly }
  # One PR for all action bumps: separate PRs editing the same workflows conflict once one is merged.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/server/app"
    schedule: { interval: monthly }
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
