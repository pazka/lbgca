# Read ONCE by `hosh-deploy register lbgca` on the box (box standard, Decision #16), which validates
# the compose hardening and pins the result in /etc/hosh-deploy/apps/lbgca.conf. Changing this file
# in the repo changes nothing on the box until someone re-registers there.
SERVICE=lbgca
IMAGE_REPO=ghcr.io/pazka/lbgca
IMAGE_VAR=APP_IMAGE
ENV_FILE=lbgca.env
HOST=api-lbgca.hosh.it
BIND=127.0.0.1:9141
HEALTH=/healthz
# Capability smoke run INSIDE the container after each deploy (non-zero ⇒ auto-rollback). Plain argv, no shell.
# server/app/smoke.py: login, order write/edit/read/delete, logout (leaves no order; account hosh-smoke stays).
POST_DEPLOY=python /app/smoke.py http://127.0.0.1:8000
REPO=pazka/lbgca
